<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generated Comics</title>
    <style>
        .image-container {
            margin-bottom: 20px;
        }
        .generated-image {
            width: 100%;
            max-width: 500px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Your Generated Comics</h1>
    {% for image in images %}
        <div class="image-container">
            <img src="{{ url_for('static', filename='generated_images/' + image) }}" alt="Generated Image {{ loop.index }}" class="generated-image">
        </div>
    {% endfor %}
    <a href="{{ url_for('index') }}">Go Back</a>
</body>
</html>
