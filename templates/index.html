<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comic Generator</title>
    <style>
        /* Basic styling */
        .prompt-input {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .generate-button {
            width: 100%;
            height: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <form method="POST">
        <textarea name="prompt1" class="prompt-input" placeholder="Enter prompt 1"></textarea>
        <textarea name="prompt2" class="prompt-input" placeholder="Enter prompt 2"></textarea>
        <textarea name="prompt3" class="prompt-input" placeholder="Enter prompt 3"></textarea>
        <textarea name="prompt4" class="prompt-input" placeholder="Enter prompt 4"></textarea>
        <button type="submit" class="generate-button">Generate</button>
    </form>
</body>
</html>
